# wgpu-native v24.0.0.1 (https://github.com/gfx-rs/wgpu-native), the C
# library behind the WebGPU backend (own bindings over Artifacts, no Pkg at
# run time). The tarballs are the ones WGPUNative.jl 0.1.5 repackaged from the
# official release (same lib, same headers, plus
# `wgpu-native-meta/wgpu-native-git-tag` = v24.0.0.1), so a machine that has
# that package installed already has this artifact, byte for byte, and
# `Pkg.instantiate()` fetches it everywhere else. `src/backend/wgpu/bindings.jl`
# resolves `lib/libwgpu_native.<ext>` from here at precompile time and opens
# it lazily, on the first call — `using Janim` never touches it.

